.rubric-translation { margin-top:6px; color:var(--muted); font-size:13px; }

.rubric-divider { width:52px; height:1px; margin:13px auto; background:#dbcfc8; }
.empty-cell { color:#c3bdb7; }
footer { padding:25px; color:#8a93a3; text-align:center; font-size:12px; }

    const gridApis = {};
    const initialPlace = "";
    let activePlaces = initialPlace ? new Set([initialPlace]) : null;
    const placeMatches = places => activePlaces === null || places.some(place => activePlaces.has(place));
    const manuscriptFields = reportTabs[0]?.columns.filter(column => column.manuscript).map(column => column.field) || [];
    let visibleManuscripts = new Set(manuscriptFields);
    function rowHasVisibleContent(data) {
      return [...visibleManuscripts].some(field => {
        const value = data[field];
        if (Array.isArray(value)) return value.some(item => placeMatches(item.places));
        return Boolean(value) && (activePlaces === null || placeMatches(data._places || []));
      });
    }
    function htmlCell(params) {
      const wrapper = document.createElement('div');
      wrapper.className = 'cell-content';
      const items = Array.isArray(params.value) ? params.value : [{ html: params.value || '', places: [] }];
      const visibleItems = items.filter(item => placeMatches(item.places));
      wrapper.innerHTML = visibleItems.map(item => item.html).join('<div class="rubric-divider"></div>') || '<span class="empty-cell">—</span>';
      return wrapper;
    }
    reportTabs.forEach(tab => {
      const columnDefs = tab.columns.map((column, index) => ({
        ...column, minWidth: index === 0 ? 180 : 280, maxWidth: index === 0 ? 320 : undefined,
        flex: index === 0 ? 0 : 1, sortable: true, resizable: true, wrapText: true,
        autoHeight: true, cellRenderer: index === 0 ? undefined : htmlCell,
        cellClass: index === 0 ? 'key-cell' : 'manuscript-cell'
      }));
      gridApis[tab.id] = agGrid.createGrid(document.getElementById(`grid-${tab.id}`), {
        columnDefs, rowData: tab.rows, animateRows: true,
        suppressCellFocus: true, defaultColDef: { suppressHeaderMenuButton: true },
        isExternalFilterPresent: () => activePlaces !== null || visibleManuscripts.size < manuscriptFields.length,
        doesExternalFilterPass: node => rowHasVisibleContent(node.data),
        onFilterChanged: event => {
          const count = event.api.getDisplayedRowCount();
          document.getElementById(`entry-count-${tab.id}`).textContent = `${count} ${count === 1 ? 'entry' : 'entries'}`;
        }
      });
    });
    const tabButtons = document.querySelectorAll('.tab-button');
    function activateTab(tabId) {
      tabButtons.forEach(item => { item.classList.remove('active'); item.setAttribute('aria-selected', 'false'); });
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
      const button = document.querySelector(`.tab-button[data-tab="${tabId}"]`);
      button.classList.add('active'); button.setAttribute('aria-selected', 'true');
      document.getElementById(`panel-${tabId}`).classList.add('active');
    }
    tabButtons.forEach(button => button.addEventListener('click', () => activateTab(button.dataset.tab)));
    document.addEventListener('click', event => {
      const link = event.target.closest('.grid-link');
      if (!link) return;
      const tabId = link.dataset.targetTab;
      const api = gridApis[tabId];
      let targetNode;
      api.forEachNodeAfterFilterAndSort(node => {
        if (!targetNode && (node.data._navigation_key || node.data.key) === link.dataset.targetKey) targetNode = node;
      });
      if (!targetNode) return;
      activateTab(tabId);
      requestAnimationFrame(() => {
        api.ensureIndexVisible(targetNode.rowIndex, 'top');
        api.flashCells({ rowNodes: [targetNode] });
      });
    });
    function setColumnVisible(field, visible) {
      Object.values(gridApis).forEach(api => api.setColumnsVisible([field], visible));
    }
    function applyManuscriptFilter() {
      visibleManuscripts = new Set(
        [...document.querySelectorAll('[data-column]:checked')].map(input => input.dataset.column)
      );
      Object.values(gridApis).forEach(api => api.onFilterChanged());
    }
    document.querySelectorAll('[data-column]').forEach(input => input.addEventListener('change', () => {
      setColumnVisible(input.dataset.column, input.checked);
      applyManuscriptFilter();
    }));
    document.getElementById('show-none').addEventListener('click', () => {
      document.querySelectorAll('[data-column]').forEach(input => { input.checked = false; setColumnVisible(input.dataset.column, false); });
      applyManuscriptFilter();
    });
    document.getElementById('show-all').addEventListener('click', () => {
      document.querySelectorAll('[data-column]').forEach(input => { input.checked = true; setColumnVisible(input.dataset.column, true); });
      applyManuscriptFilter();
    });
    const allPlaces = document.getElementById('all-places');
    const placeInputs = [...document.querySelectorAll('[data-place]')];
    function applyPlaceFilter() {
      const selected = placeInputs.filter(input => input.checked).map(input => input.dataset.place);
      if (!selected.length) {
        allPlaces.checked = true;
        activePlaces = null;
      } else {
        allPlaces.checked = false;
        activePlaces = new Set(selected);
      }
      document.getElementById('place-count').textContent = selected.length || placeInputs.length;
      Object.values(gridApis).forEach(api => {
        api.onFilterChanged();
        api.refreshCells({ force: true });
      });
    }
    if (allPlaces) {
      allPlaces.addEventListener('change', () => {
        allPlaces.checked = true;
        placeInputs.forEach(input => { input.checked = false; });
        activePlaces = null;
        document.getElementById('place-count').textContent = placeInputs.length;
        Object.values(gridApis).forEach(api => {
          api.onFilterChanged();
          api.refreshCells({ force: true });
        });
      });
      placeInputs.forEach(input => input.addEventListener('change', applyPlaceFilter));
    }
    if (initialPlace) Object.values(gridApis).forEach(api => api.onFilterChanged());
  </script>
